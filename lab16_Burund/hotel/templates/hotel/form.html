{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form class="form" method="post" novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}<div class="flash flash-error">{{ form.non_field_errors|join:" " }}</div>{% endif %}
  {% for field in form %}
    <label class="{% if field.errors %}has-error{% endif %}">{{ field.label }}
      {{ field }}
      {% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}
    </label>
  {% endfor %}
  <div class="buttons">
    <button type="submit">Сохранить</button>
    <a href="javascript:history.back()">Отмена</a>
  </div>
</form>
{% endblock %}
