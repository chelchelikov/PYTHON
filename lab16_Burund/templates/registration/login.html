{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1>Вход</h1>
<form class="form" method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <label>{{ field.label }} {{ field }} {{ field.errors }}</label>
  {% endfor %}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Войти</button>
</form>
<p class="muted">Демо-учётки: администратор <code>admin / admin12345</code>,
  пользователь <code>user / user12345</code>.</p>
{% endblock %}
