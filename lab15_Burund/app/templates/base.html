<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ресторан{% endblock %} — «У Бурунда»</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('web.index') }}">🍽 У Бурунда</a>
  <nav>
    <a href="{{ url_for('web.dish_list') }}">Меню</a>
    <a href="{{ url_for('web.category_list') }}">Категории</a>
    <a href="{{ url_for('web.order_list') }}">Заказы</a>
    <a class="button" href="{{ url_for('web.order_create') }}">Оформить заказ</a>
  </nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="footer">Лабораторная работа №15 · Flask · вариант 5</footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
