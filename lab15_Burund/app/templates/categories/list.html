{% extends "base.html" %}
{% block title %}Категории{% endblock %}
{% block content %}
<h1>Категории</h1>
<table class="table">
  <thead><tr><th>Категория</th><th>Описание</th><th>Блюд</th><th></th></tr></thead>
  <tbody>
  {% for category in categories %}
    <tr>
      <td><a href="{{ url_for('web.category_detail', category_id=category.id) }}">{{ category.name }}</a></td>
      <td>{{ category.description }}</td>
      <td>{{ category.dishes|length }}</td>
      <td class="actions">
        <form method="post" action="{{ url_for('web.category_delete', category_id=category.id) }}" data-confirm="Удалить категорию «{{ category.name }}»?">
          <button class="link danger" type="submit">удалить</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
<h2>Новая категория</h2>
<form class="form inline" method="post" action="{{ url_for('web.category_create') }}">
  <input name="name" placeholder="Название" required maxlength="50">
  <input name="description" placeholder="Описание">
  <button type="submit">Добавить</button>
</form>
{% endblock %}
