# Итоговый проект. Вариант 5. Ресторан (уровень B: API + worker + PostgreSQL + Redis + RabbitMQ)
#   cp .env.example .env && docker compose up --build

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?задайте в .env}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD:?задайте в .env}@broker:5672/
  JWT_SECRET: ${JWT_SECRET:?задайте в .env}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте в .env}
  MENU_CACHE_TTL: ${MENU_CACHE_TTL:-60}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  app:
    build: .
    image: restaurant/app:latest
    ports:
      - "${APP_PORT:-8000}:8000"
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  worker:
    image: restaurant/app:latest
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    healthcheck: { disable: true }
    depends_on:
      app: { condition: service_healthy }
      broker: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
    restart: unless-stopped

  broker:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
    volumes: [broker-data:/var/lib/rabbitmq]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, retries: 10 }
    restart: unless-stopped

volumes:
  db-data:
  broker-data:
