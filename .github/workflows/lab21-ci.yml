# CI для итогового проекта (лабораторная работа №21).
# Install → Lint → Tests (+PostgreSQL, Redis, RabbitMQ) → Coverage → Docker build → smoke test
name: lab21 CI

on:
  push:
    paths: ["lab21_Burund/**", ".github/workflows/lab21-ci.yml"]
  pull_request:
    paths: ["lab21_Burund/**", ".github/workflows/lab21-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: lab21_Burund

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab21_Burund/requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests on PostgreSQL + coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          TEST_BROKER_URL: amqp://guest:guest@localhost:5672/
        run: pytest -v --cov --cov-report=term-missing --cov-fail-under=85

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Docker build
        run: docker compose build

      - name: Smoke test
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl -sf localhost:8000/health | jq -e '.status == "healthy" and .redis == "healthy"'
          curl -sf "localhost:8000/dishes?limit=3" | jq -e '.total > 0'
          curl -s -o /dev/null -w "%{http_code}" -X POST localhost:8000/orders \
            -H 'Content-Type: application/json' -d '{}' | grep -q 401

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Cleanup
        if: always()
        run: docker compose down -v
